# Database (local/in-memory H2). On OpenShift use the DB settings from the coursework tutorial.
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:hotel;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.database.generation=drop-and-create

# Swagger UI available in every profile (needed on OpenShift)
quarkus.swagger-ui.always-include=true

# Part 3: URLs of the three services (change taxi/flight to your classmates' deployed URLs)
quarkus.rest-client.taxi.url=http://localhost:8082
quarkus.rest-client.flight.url=http://localhost:8083
quarkus.rest-client.hotel.url=http://localhost:8080

# Part 3: OpenShift
quarkus.openshift.route.expose=true